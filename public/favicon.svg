<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    .paper { fill: #f4f4f2; }
    .ink { fill: #111111; }
    .accent { fill: #cf2a21; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #121212; }
      .ink { fill: #ecece9; }
      .accent { fill: #ff5648; }
    }
  </style>
  <rect class="paper" width="64" height="64"/>
  <text class="ink" x="6" y="52" font-family="Archivo, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" letter-spacing="-3">R</text>
  <rect class="accent" x="46" y="42" width="12" height="12"/>
</svg>
